                      type: string
                      format: uuid
                      description: Halo GUID of the site.
                    mode:
                      type: string
                      enum:
                      - immediate
                    maxTimeInQueue:
                      type: integer
                      format: milli-seconds
                      example: 15000
                      minimum: 0
                      maximum: 60000
                      default: 30000
                    commandSize:
                      type: integer
                      example: 98
                    requestSize:
                      type: integer
                      example: 98
                    createdAt:
