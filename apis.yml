apis:
- aid: halo-connect:halo-cloud-integrator-api
  name: Halo Cloud API for Integrators
  description: The Halo Cloud API for third-party software integrators to query on-premise practice management
    system databases over the cloud, covering site pairing, SQL passthrough (immediate and async queries),
    FHIR R4 resource search, and registered (recurring) queries. Authenticated with an Azure API Management
    subscription key.
  humanURL: https://docs.haloconnect.io/halo-cloud/overview/
  baseURL: https://api.haloconnect.io
  tags:
  - FHIR
  - Healthcare
  - Interoperability
  - SQL
  properties:
  - type: OpenAPI
    url: openapi/halo-connect-integrator-openapi.json
  - type: Documentation
    url: https://docs.haloconnect.io/halo-cloud/overview/
  - type: APIReference
    url: https://docs.haloconnect.io/api-reference/integrator-openapi.html
- aid: halo-connect:halo-cloud-desktop-api
  name: Halo Cloud API for Desktop Applications
  description: The Halo Cloud API for desktop applications, exposing a token endpoint plus SQL passthrough,
    FHIR R4 resource search, and registered-query operations under the /desktop path. Authenticated with
    an Azure API Management subscription key, a bearer JWT, and a device identifier header.
  humanURL: https://docs.haloconnect.io/halo-cloud/overview/
  baseURL: https://api.haloconnect.io
  tags:
  - FHIR
  - Healthcare
  - Interoperability
  - SQL
  properties:
  - type: OpenAPI
    url: openapi/halo-connect-desktop-openapi.json
  - type: Documentation
    url: https://docs.haloconnect.io/halo-cloud/overview/
  - type: APIReference
    url: https://docs.haloconnect.io/api-reference/desktop-openapi.html
- aid: halo-connect:halo-cloud-fhir-api
  name: Halo Cloud FHIR API
  description: Halo Connect's FHIR API for accessing primary-care data from on-premise practice management
    systems, based on FHIR Release 4 (R4) version 4.0.1 and built toward the AU Base 4.1.0 implementation
    guide. Requests are site-scoped under https://api.haloconnect.io/integrator/sites/{haloGuid}/fhir/R4/{resourceType}
    and support search, read, and the Patient $summary operation. Supported resources (for example Patient,
    Practitioner, Appointment, DocumentReference) vary per PMS, and a live CapabilityStatement is served
    at {baseUrl}/metadata behind subscription authentication.
  humanURL: https://docs.haloconnect.io/halo-cloud/fhir-api/overview/
  baseURL: https://api.haloconnect.io
