aid: halo-connect
url: https://raw.githubusercontent.com/api-evangelist/halo-connect/refs/heads/main/apis.yml
name: Halo Connect
kind: company
description: Halo Connect is an Australian healthcare interoperability platform, founded in 2021 and headquartered
  in Brisbane, Queensland, that makes primary-care data integration simple by exposing on-premise practice
  management system (PMS) databases through a modern cloud API. Its Halo Link agent and Halo Cloud service
  let approved software integrators query systems such as Best Practice, Zedmed, and Dental4Windows using
  either SQL passthrough or a standards-based FHIR R4 (4.0.1) API built toward the AU Base 4.1.0 implementation
  guide, without maintaining a separate database agent per integration. Halo Connect built the first FHIR
  API for the Best Practice Premier medical-practice industry. The platform runs on Microsoft Azure hosted
  in Australia, and access is gated behind a Halo Cloud subscription using Azure API Management subscription
  keys and, for desktop applications, bearer JWT tokens issued from a token endpoint; there is no self-serve
  public API.
